version: '3'
services:
  mongo:
    container_name: mongo
    image: mongo
    user: mongodb
    environment:
      - MONGODB_USER
      - MONGODB_PWORD
      - MONGODB_PORT=${MONGODB_PORT}
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PWORD}
    ports:
      - '27019:27017'
    command: mongod --logpath /var/log/mongodb/mongod.log
    volumes:
      - "./dbAuthdData:/data/db"
      - "./dbAuthdData/backups:/data/backups"
      - "./dbAuthdData/logs:/var/log/mongodb"
      - ./dev-mongo-init.sh:/usr/local/bin/mongo-init.sh
    entrypoint: [ "/usr/local/bin/mongo-init.sh" ]
    stop_grace_period: 1m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
